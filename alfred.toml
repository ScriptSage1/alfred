# Alfred configuration file.
# Alfred reads this from the current directory when it starts.
# Use `alfred --config path/to/other.toml` to load a different file.

[alfred]
name = "Alfred"

# One of: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = "INFO"

# Modules to load at startup. Each name matches a file in src/alfred/modules/.
modules = ["hello"]

[obsidian]
# Where the Obsidian "Local REST API" plugin listens.
# HTTPS (default, port 27124) or HTTP (port 27123, must be enabled in the plugin).
# The OBSIDIAN_URL environment variable overrides this.
url = "https://127.0.0.1:27124"

# The plugin's certificate authority, needed for HTTPS. Download it once with:
#   curl -k https://127.0.0.1:27124/obsidian-local-rest-api.crt -o obsidian-local-rest-api.crt
# The OBSIDIAN_CA_CERT environment variable overrides this.
ca_cert = "obsidian-local-rest-api.crt"

# Seconds to wait for Obsidian before giving up.
timeout = 10

# The API key is NOT set here. Put it in the OBSIDIAN_API_KEY environment variable.
