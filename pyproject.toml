# pyproject.toml is the single place that describes this Python project:
# how to build it, what it depends on, and how tools (like pytest) behave.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
dynamic = ["version"]  # read from alfred.__version__ (see [tool.setuptools.dynamic])
description = "Alfred, a personal desktop AI assistant (learning project)."
readme = "README.md"
requires-python = ">=3.11"  # 3.11+ ships tomllib in the standard library
dependencies = [
    "httpx>=0.28",          # HTTP client, used only by alfred.obsidian
    "pyyaml>=6.0",          # reads YAML frontmatter in task files
    "pydantic>=2.7",        # validates the arguments the AI passes to tools
    "github-copilot-sdk>=1.0.16,<2",  # GitHub Copilot, used only by alfred.agent.copilot_backend
    "PySide6>=6.10",        # the desktop UI (Qt), used only by alfred.ui
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Installing the project creates an `alfred` command that calls main().
[project.scripts]
alfred = "alfred.__main__:main"

# The same entry point as a windowed app: no console window appears.
[project.gui-scripts]
alfred-desktop = "alfred.__main__:main"

[tool.setuptools.package-data]
alfred = ["ui/*.png"]

[tool.setuptools.dynamic]
version = { attr = "alfred.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"  # print a short summary of skipped/failed tests at the end
